name: Build portable app
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
        env:
          QT_QPA_PLATFORM: offscreen
          COURSEDESK_NO_OS_ACTIONS: '1'
      - name: Build
        shell: powershell
        run: .\build_desktop.ps1 -PythonExe (Get-Command python).Source
      - name: Verify packaged privacy and empty first launch
        shell: powershell
        run: .\tests\verify_package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: CourseDesk-Windows-x64
          path: release/*
          if-no-files-found: error
